name: "MinusOps PR Reviewer"
description: >-
  Run the full MinusOps review on a Terraform directory and post it to the PR: gate verify,
  a plan under read-only OIDC, BCM cost preparation, and the 5-gate Stage Reflector.

# Composite, not a reusable workflow: a reviewer belongs next to each repo's own build steps,
# and shipping it as a workflow would force our triggers and concurrency onto them.
#
# What this deliberately does NOT do:
#   - apply anything. It plans. The apply path stays in deploy.yml behind the environment gate.
#   - invent a cost. Absent BCM evidence renders "unavailable" plus the command that produces
#     it. A plausible-looking figure in a PR comment gets believed.
#   - treat the reflector's `unknown` as a pass. A gate that could not run has approved nothing.

inputs:
  tf_dir:
    description: "Terraform directory to review (relative to the repo root)"
    required: true
  run_root:
    description: >-
      Run workspace holding requirements.json and reports/ (defaults to tf_dir's parent).
      The reflector's scope and cost gates read from here.
    required: false
    default: ""
  role_to_assume:
    description: >-
      READ-ONLY AWS role ARN for OIDC. A plan needs read access and nothing more; give this
      role no write permissions, because a PR from a fork must never hold them.
    required: false
    default: ""
  aws_region:
    required: false
    default: "us-east-1"
  policy_mode:
    description: "standard | production (production additionally requires an external scanner)"
    required: false
    default: "standard"
  budget_usd:
    description: "Monthly ceiling to diff the BCM forecast against. Blank reads it from requirements.json."
    required: false
    default: ""
  terraform_version:
    required: false
    default: "1.10.5"
  python_version:
    required: false
    default: "3.12"
  comment:
    description: "Post the review as a PR comment. false produces the artifacts only."
    required: false
    default: "true"
  github_token:
    description: "Token used to post the comment. Needs pull-requests: write."
    required: false
    default: ""

outputs:
  verdict:
    description: "pass | blocked"
    value: ${{ steps.reflect.outputs.verdict }}
  plan_hash:
    description: "SHA-256 of the reviewed plan, the value the merge gate re-verifies"
    value: ${{ steps.plan.outputs.plan_hash }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    # Credentials are optional on purpose: `verify` needs none, so a fork PR still gets a real
    # security review even with no role configured. It just does not get a plan.
    - name: Configure AWS credentials (OIDC, read-only)
      if: ${{ inputs.role_to_assume != '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_to_assume }}
        aws-region: ${{ inputs.aws_region }}

    - name: Verify (fmt, validate, security scan)
      id: verify
      shell: bash
      env:
        TF_DIR: ${{ inputs.tf_dir }}
        POLICY_MODE: ${{ inputs.policy_mode }}
      run: |
        set -uo pipefail
        mkdir -p .minus-review
        python core/governance/plan_gate.py verify --dir "$TF_DIR" \
          --policy-mode "$POLICY_MODE" > .minus-review/verify.txt 2>&1
        echo "rc=$?" >> "$GITHUB_OUTPUT"
        tail -n 20 .minus-review/verify.txt

    - name: Plan (record the hash)
      id: plan
      if: ${{ inputs.role_to_assume != '' }}
      shell: bash
      env:
        TF_DIR: ${{ inputs.tf_dir }}
      run: |
        set -uo pipefail
        python core/governance/plan_gate.py plan --dir "$TF_DIR" > .minus-review/plan.txt 2>&1 || true
        # The hash comes from the gate's own record, not scraped from log text: the log prints
        # a truncated prefix, and the merge gate compares full digests.
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import glob, json, os
        target = os.path.abspath(os.environ["TF_DIR"])
        for path in glob.glob(".agents/logs/plan_gate/*/pending_plan.json"):
            try:
                record = json.load(open(path, encoding="utf-8"))
            except (OSError, ValueError):
                continue
            if os.path.abspath(record.get("dir", "")) == target:
                print(f"plan_hash={record.get('plan_hash', '')}")
                break
        else:
            print("plan_hash=")
        PY

    - name: BCM cost preparation
      id: bcm
      if: ${{ inputs.role_to_assume != '' && steps.plan.outputs.plan_hash != '' }}
      shell: bash
      env:
        RUN_ROOT: ${{ inputs.run_root }}
        TF_DIR: ${{ inputs.tf_dir }}
        PLAN_HASH: ${{ steps.plan.outputs.plan_hash }}
      run: |
        set -uo pipefail
        ROOT="${RUN_ROOT:-$(dirname "$TF_DIR")}"
        REPORT="$ROOT/reports/${PLAN_HASH:0:12}"
        if [ -d "$REPORT" ]; then
          python core/cost/bcm_pricing_calculator.py prepare --report-dir "$REPORT" \
            > .minus-review/bcm.txt 2>&1 || true
          echo "estimate=$REPORT/bcm-estimate.json" >> "$GITHUB_OUTPUT"
        else
          # No report bundle means the plan step did not get far enough. Say so; do not
          # fabricate a directory and then report its absence as a cost of zero.
          echo "no report bundle at $REPORT" > .minus-review/bcm.txt
          echo "estimate=" >> "$GITHUB_OUTPUT"
        fi

    - name: Stage Reflector (5 gates)
      id: reflect
      shell: bash
      env:
        RUN_ROOT: ${{ inputs.run_root }}
        TF_DIR: ${{ inputs.tf_dir }}
      run: |
        set -uo pipefail
        ROOT="${RUN_ROOT:-$(dirname "$TF_DIR")}"
        python core/governance/reflector.py --run-root "$ROOT" --dir "$TF_DIR" --json \
          > .minus-review/reflector.json 2>.minus-review/reflector.err
        RC=$?
        python core/governance/reflector.py --run-root "$ROOT" --dir "$TF_DIR" || true
        if [ "$RC" -eq 2 ] || [ "${{ steps.verify.outputs.rc }}" != "0" ]; then
          echo "verdict=blocked" >> "$GITHUB_OUTPUT"
        else
          echo "verdict=pass" >> "$GITHUB_OUTPUT"
        fi

    - name: Render the comment
      id: body
      shell: bash
      env:
        RUN_ROOT: ${{ inputs.run_root }}
        TF_DIR: ${{ inputs.tf_dir }}
        PLAN_HASH: ${{ steps.plan.outputs.plan_hash }}
        BCM_JSON: ${{ steps.bcm.outputs.estimate }}
        BUDGET: ${{ inputs.budget_usd }}
      run: |
        set -uo pipefail
        ROOT="${RUN_ROOT:-$(dirname "$TF_DIR")}"
        SVG="$(ls -t "$ROOT"/reports/*/architecture.svg 2>/dev/null | head -1 || true)"
        python .github/actions/pr-reviewer/comment.py \
          --verify-log .minus-review/verify.txt \
          --plan-log .minus-review/plan.txt \
          --reflector-json .minus-review/reflector.json \
          ${BCM_JSON:+--bcm-json "$BCM_JSON"} \
          ${PLAN_HASH:+--plan-hash "$PLAN_HASH"} \
          ${BUDGET:+--budget-usd "$BUDGET"} \
          ${SVG:+--svg "$SVG"} \
          --tf-dir "$TF_DIR" \
          --out .minus-review/comment.md

    - name: Post the comment
      if: ${{ inputs.comment == 'true' && inputs.github_token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        # Sticky: edit the existing comment rather than appending one per push. A 40-comment
        # PR is a PR nobody reads.
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file .minus-review/comment.md --edit-last --create-if-none

    - name: Upload review evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: minusops-review
        path: |
          .minus-review/**
          runs/*/reports/**
          artifacts/reports/**
        if-no-files-found: ignore
