name: "Terraform CI/CD (governed)"

# Workload-agnostic pipeline: you supply WHICH Terraform directory to act on.
# - test:     runs the engine's own pytest suite. `pyproject.toml` deselects the tests
#             marked slow, so the real-terraform gate e2e is NOT in this job -- it runs
#             in ci.yml's `slow` job. This line claimed otherwise and was wrong.
# - validate: static checks on the chosen dir, no cloud credentials.
# - deploy:   gated behind a human approval (the `production` environment) AND the
#             project's own plan-gate, so apply runs ONLY the exact reviewed plan hash.
on:
  workflow_dispatch:
    inputs:
      tf_dir:
        description: "Terraform directory to validate / deploy (relative to repo root)"
        required: true
        type: string
      tfstate_key:
        description: "Remote state key for this deploy (e.g. myapp/prod/terraform.tfstate)"
        required: true
        type: string
      apply:
        description: "Run apply after plan (still gated by the production environment)"
        required: false
        default: false
        type: boolean
      approval_file:
        description: >-
          Path to the approval record for this plan, read from a store the plan role cannot
          write. Verified by core/governance/apply_broker.py: hash match, approver identity,
          two-person, freshness. Empty means the apply is bound to a hash string only.
        required: false
        default: ""
        type: string
      approved_plan_hash:
        description: >-
          MINUS-145. The SHA-256 the PR reviewer posted and a human signed off on. When set,
          the deploy job re-plans and refuses to apply unless the hash it computes now matches
          this one exactly. Leave blank only for a deploy that was never reviewed through a PR.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write # required for AWS OIDC federation

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"

jobs:
  # ---------------------------------------------------------------------------
  # Engine self-tests. Proves the gate invariants (incl. real-terraform e2e)
  # before any infrastructure action is allowed.
  # ---------------------------------------------------------------------------
  test:
    name: "Engine tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false   # tests invoke the real terraform binary
      - name: Run test suite
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  # Static checks on the chosen dir. No cloud credentials.
  # ---------------------------------------------------------------------------
  validate:
    name: "Validate & Scan"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # plan_gate verify == fmt -check + init (no backend) + validate + security scan.
      - name: Verify (gate static checks)
        run: minusctl gate verify --dir "${{ inputs.tf_dir }}"

  # ---------------------------------------------------------------------------
  # Deploy only when apply=true, AFTER validate, AND after manual approval.
  # `environment: production` is the HUMAN gate (configure required reviewers in
  # repo Settings -> Environments). The plan-gate is the TECHNICAL gate: apply runs
  # the exact reviewed plan hash, audited, refusing on any drift. Auth is OIDC.
  # ---------------------------------------------------------------------------
  deploy:
    name: "Gated plan-bound apply"
    needs: validate
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # OIDC: assumes the MFA-/condition-gated deploy role; no static access keys.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Remote state via partial backend config (repo var TFSTATE_BUCKET). The gate's
      # plan/apply reuse this initialized backend.
      - name: Init (remote state)
        working-directory: ${{ inputs.tf_dir }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="key=${{ inputs.tfstate_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      # Plan -> record plan-hash + report. Approve -> hash-bound approval (the human
      # already approved via the environment gate; auto-approve skips only the TTY
      # prompt, never the hash binding). Apply -> re-checks the hash and applies the
      # EXACT reviewed tfplan, or refuses. Every stage is appended to the audit log.
      - name: Plan (record plan hash)
        id: plan
        run: |
          minusctl gate plan --dir "${{ inputs.tf_dir }}"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os
          target = os.path.abspath("${{ inputs.tf_dir }}")
          for path in glob.glob(".agents/logs/plan_gate/*/pending_plan.json"):
              try:
                  record = json.load(open(path, encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              if os.path.abspath(record.get("dir", "")) == target:
                  print(f"plan_hash={record.get('plan_hash', '')}")
                  break
          else:
              print("plan_hash=")
          PY

      # MINUS-145. The plan gate already refuses to apply a tfplan that drifted from the one it
      # recorded. This is the other half: it checks the plan recorded HERE against the hash a
      # human approved on the PR. Without it, a merge that changed the Terraform still applies
      # cleanly -- the gate would be verifying this run against its own fresh plan, which always
      # matches, and the reviewer's sign-off would bind to nothing.
      - name: Re-verify the approved plan hash
        if: ${{ inputs.approved_plan_hash != '' }}
        env:
          APPROVED: ${{ inputs.approved_plan_hash }}
          COMPUTED: ${{ steps.plan.outputs.plan_hash }}
        run: |
          if [ -z "$COMPUTED" ]; then
            echo "::error::no plan hash was recorded for ${{ inputs.tf_dir }} -- refusing to apply"
            exit 1
          fi
          if [ "$APPROVED" != "$COMPUTED" ]; then
            echo "::error::plan hash mismatch -- the reviewed plan is not the plan on main."
            echo "  approved on the PR : $APPROVED"
            echo "  computed on main   : $COMPUTED"
            echo "Re-run the PR reviewer on the merged commit and get a fresh sign-off."
            exit 1
          fi
          echo "Plan hash matches the PR sign-off: $COMPUTED"

      # An unreviewed deploy is allowed, but it is never silent: the run log has to say that
      # nothing bound this apply to a human-reviewed plan.
      - name: Warn on an unreviewed deploy
        if: ${{ inputs.approved_plan_hash == '' }}
        run: |
          echo "::warning::approved_plan_hash was not supplied -- this apply is bound to no PR sign-off."
      # The hash check above compares two strings the WORKFLOW was handed. This checks the
      # approval RECORD: who approved, whether they are the person who planned it, and how
      # long ago. `approved_plan_hash` is a workflow input -- whoever triggers the run
      # supplies it -- so on its own it proves the caller knows a hash, not that a human
      # approved anything.
      #
      # Point approval_file at a store the PLAN role cannot write. Reading it from the
      # runner's own checkout proves only that the file is there.
      - name: Release check (approval record, not just the hash)
        if: ${{ inputs.approval_file != '' }}
        run: |
          python -m core.governance.apply_broker             --dir "${{ inputs.tf_dir }}"             --approval-file "${{ inputs.approval_file }}"             --max-age-hours 24             --json
      - name: Warn when no approval record was supplied
        if: ${{ inputs.approval_file == '' }}
        run: |
          echo "::warning::approval_file was not supplied -- nothing verified WHO approved this plan, only that a hash matched."
      - name: Approve (hash-bound; human gate already passed)
        run: minusctl gate approve --dir "${{ inputs.tf_dir }}" --mode auto-approve
      - name: Apply (exact approved plan only)
        run: minusctl gate apply --dir "${{ inputs.tf_dir }}"

      - name: Upload audit log + deploy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence
          path: |
            .agents/logs/audit.jsonl
            artifacts/reports/**
          if-no-files-found: ignore
