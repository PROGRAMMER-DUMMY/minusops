name: Native Sim internal preview

on:
  push:
    branches: [build/native-sim-openrouter]
    paths:
      - app/sim-native/**
      - core/reporting/operations_models.py
      - .github/workflows/native-sim-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-sim-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            app/sim-native
            core/reporting/operations_models.py
          sparse-checkout-cone-mode: false

      - name: Prove private draft transport before building
        id: export
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="native-sim-private-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true' ERR
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title 'Private native Sim build export' --notes 'Internal evaluation image. Keep this release a draft; do not publish.'
          release_id=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          test "$(gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)" = true
          status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id")
          test "$status" = 404
          printf 'Non-sensitive private transport check.\n' > "$RUNNER_TEMP/transport-probe.txt"
          gh release upload "$tag" "$RUNNER_TEMP/transport-probe.txt" --repo "$GITHUB_REPOSITORY"
          asset_id=$(gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[0].id')
          asset_url=$(gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[0].browser_download_url')
          status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id")
          test "$status" = 404
          status=$(curl --silent --show-error --head --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$asset_url")
          test "$status" = 404
          printf 'tag=%s\nrelease_id=%s\n' "$tag" "$release_id" >> "$GITHUB_OUTPUT"

      - name: Reclaim unused SDKs on this disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 30 * 1024**3, "Native build requires 30 GiB free on its runner"'

      - name: Bound transient compiler pressure with disposable runner swap
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          swap_path="$RUNNER_TEMP/native-sim.swap"
          test ! -e "$swap_path"
          sudo fallocate -l 8G "$swap_path"
          sudo chmod 600 "$swap_path"
          sudo mkswap "$swap_path"
          sudo swapon "$swap_path"
          python3 -c 'from pathlib import Path; m=dict(line.split(":",1) for line in Path("/proc/meminfo").read_text().splitlines()); assert int(m["SwapTotal"].split()[0]) >= 8 * 1024**2 - 1024'
          free -h
          docker info --format 'Docker engine memory: {{.MemTotal}} bytes'

      - name: Prepare pinned public inputs only
        shell: bash
        run: |
          set -euo pipefail
          revision=$(python3 -c 'import json,re; r=json.load(open("app/sim-native/patch-manifest.json"))["upstream_revision"]; assert re.fullmatch("[a-f0-9]{40}",r); print(r)')
          git init "$RUNNER_TEMP/sim-source"
          git -C "$RUNNER_TEMP/sim-source" fetch --depth=1 https://github.com/simstudioai/sim.git "$revision"
          git -C "$RUNNER_TEMP/sim-source" checkout --detach FETCH_HEAD
          python3 app/sim-native/prepare.py --build-only --source "$RUNNER_TEMP/sim-source"
          test ! -e .minus

      - name: Restore complete native dependencies
        run: python3 app/sim-native/docker_build.py deps

      - name: Native overlay contract tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --memory=5g --memory-swap=5g --cpus=2 --ulimit core=0:0 \
            --mount "type=bind,src=$PWD/app/sim-native,dst=/sim-native,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/sim-source,dst=/native-source,readonly" \
            -e SIM_NATIVE_SOURCE_ROOT=/native-source -e SIM_NATIVE_DEPENDENCIES_ROOT=/app \
            minusops-native-sim-openrouter-deps:df3db64 \
            node --test /sim-native/tests/overlay.test.mjs /sim-native/tests/completion.test.mjs

      - name: Apply owned overlays and build native bundles
        run: python3 app/sim-native/docker_build.py source

      - name: Check owned TypeScript separately from compilation
        timeout-minutes: 12
        run: >-
          docker run --rm --memory=12g --memory-swap=20g --cpus=4 --ulimit core=0:0 -e GODEBUG=gctrace=1
          minusops-native-sim-openrouter-source:df3db64 node /overlay/typecheck.cjs

      - name: Compile internal preview with enforced resource bounds
        run: python3 app/sim-native/docker_build.py compile

      - name: Export image only to the proven private draft
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPORT_TAG: ${{ steps.export.outputs.tag }}
          EXPORT_ID: ${{ steps.export.outputs.release_id }}
        run: |
          set -euo pipefail
          private_draft() {
            test "$(gh api "/repos/$GITHUB_REPOSITORY/releases/$EXPORT_ID" --jq .draft)" = true
            status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$EXPORT_ID")
            test "$status" = 404
          }
          private_draft
          export_dir="$RUNNER_TEMP/native-image-export"
          mkdir "$export_dir"
          docker save minusops-native-sim-openrouter:df3db64 | gzip -1 | \
            split --bytes=1024M --numeric-suffixes=0 --suffix-length=3 - "$export_dir/native-sim-image.tar.gz.part-"
          export IMAGE_EXPORT_DIR="$export_dir"
          image_id=$(docker image inspect minusops-native-sim-openrouter:df3db64 --format '{{.Id}}')
          export IMAGE_ID="$image_id"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          directory=Path(os.environ['IMAGE_EXPORT_DIR'])
          parts=[]
          for p in sorted(directory.glob('native-sim-image.tar.gz.part-*')):
              with p.open('rb') as handle: digest=hashlib.file_digest(handle,'sha256').hexdigest()
              parts.append({'name':p.name,'bytes':p.stat().st_size,'sha256':digest})
          metadata={'version':1,'source_revision':os.environ['GITHUB_SHA'],
              'image_id':os.environ['IMAGE_ID'],'parts':parts}
          (directory/'image-metadata.json').write_text(json.dumps(metadata,indent=2))
          PY
          for file in "$export_dir"/*; do
            private_draft
            gh release upload "$EXPORT_TAG" "$file" --repo "$GITHUB_REPOSITORY"
          done
          private_draft
          for asset_id in $(gh api "/repos/$GITHUB_REPOSITORY/releases/$EXPORT_ID/assets" --jq '.[].id'); do
            status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id")
            test "$status" = 404
          done
          printf 'Private draft export: `%s`\n\nSource: `%s`\n\nImage: `%s`\n\nBrowser and live-provider checks remain pending.\n' \
            "$EXPORT_TAG" "$GITHUB_SHA" "$IMAGE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove incomplete draft export
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPORT_TAG: ${{ steps.export.outputs.tag }}
        run: |
          if test -n "$EXPORT_TAG"; then
            gh release delete "$EXPORT_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Release disposable runner swap
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          swap_path="$RUNNER_TEMP/native-sim.swap"
          if test -f "$swap_path"; then
            sudo swapoff "$swap_path"
            sudo rm -- "$swap_path"
          fi
