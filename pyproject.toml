[build-system]
# >=77 for PEP 639: `license = "MIT"` as an SPDX string plus `license-files`.
# Older setuptools only understands the deprecated table form and errors on this.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minusops"
version = "0.1.0"
description = "MinusOps — a governed AWS Terraform control plane (plan-bound, MFA-gated, audited deploys)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MinusOps contributors" }]
keywords = ["terraform", "governance", "finops", "devops", "iac", "aws"]
classifiers = [
    # No "License ::" classifier: PEP 639 supersedes it with the `license` expression above,
    # and setuptools>=77 errors if both are present.
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Build Tools",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
]

# Core CLIs (gate, approval, audit, scanner, intent) use only the standard library plus
# your cloud CLI -- so the base install has NO runtime dependencies. The Plotly Dash
# console is the `dashboard` extra below; it was also listed here, which meant
# `pip install .` pulled a plotting stack in just to run `minus-gate`.
dependencies = []

[project.optional-dependencies]
dashboard = [
    "dash>=2.14,<3",
    "plotly>=5.18,<6",
]
policy = [
    "checkov>=3,<4",
]
dev = [
    "pytest>=8.0,<9",
    "build>=1.2",
    "cyclonedx-bom>=4.0",
    "pyyaml>=6.0",
    "dash>=2.14,<3",
    "plotly>=5.18,<6",
]

[project.scripts]
# Pip-installable console commands — clients run `minusctl ...`, not `python core/x.py ...`.
# The unified front door (PRD-ARCH-2026-007). It owns `use`, `runs list/describe`, `gate`,
# `cost` and `source`, and delegates every other subcommand to core.reporting.minusctl,
# which stays importable and runnable on its own.
minusctl = "core.cli.main:main"
minus-gate = "core.governance.plan_gate:main"
minus-resolve = "core.generation.intent_resolver:main"
minus-workflow = "core.generation.workflow:main"
minus-bcm = "core.cost.bcm_pricing_calculator:main"
minus-runs = "core.reporting.runs:main"
minus-demo = "core.generation.demo:main"
minus-accelerator = "core.generation.accelerators:main"
minus-update-module = "core.generation.module_provenance:main"
minus-schema-watch = "core.generation.schema_watch:main"

[project.urls]
Documentation = "https://github.com/your-org/minusops/blob/main/AGENTS.md"

[tool.setuptools]
# Python code ships as the `core` package (+ provider subpackage). Runtime Terraform
# modules, required docs, examples, and local agent skill manifests are shipped below
# as data-files so installed wheels work without a source checkout.
packages = [
    "core", "core.providers",
    "core.generation", "core.architecture", "core.governance", "core.cost", "core.reporting",
    # Not optional: finops_agent imports the Slack and Jira hooks at module scope, so a wheel
    # without core.integrations fails on import, not on first notify.
    "core.integrations",
    # Both, or `minusctl` resolves to a module the wheel does not contain.
    "core.cli", "core.cli.commands",
]

[tool.setuptools.package-data]
core = ["py.typed"]
# pricing_data lives inside the core.cost package (not a sibling dir like modules/docs/examples
# below), so it belongs here, not in [tool.setuptools.data-files] -- it was omitted from both,
# which is why a real wheel install never had it (core/cost/pricing_data/*.json missing ->
# pricing_catalog.resolve_resource_type() crashed with FileNotFoundError on first use).
"core.cost" = ["pricing_data/*.json"]

[tool.setuptools.data-files]
# NOTE: this list is hand-maintained and does not auto-discover new modules/<id> dirs -- it's
# exactly how 5 of 14 modules went missing from the wheel before (added to modules/ but never
# added here). When adding a new module, add its data-files entry here too, and check
# `python -m build --wheel` actually contains it before considering the module done.
"modules/storage-medallion-s3" = ["modules/storage-medallion-s3/main.tf"]
"modules/orchestrator-mwaa" = ["modules/orchestrator-mwaa/main.tf"]
"modules/orchestrator-stepfunctions" = ["modules/orchestrator-stepfunctions/main.tf"]
"modules/compute-glue-etl" = ["modules/compute-glue-etl/main.tf"]
"modules/compute-glue-etl/scripts" = ["modules/compute-glue-etl/scripts/etl.py"]
"modules/compute-emr-serverless" = ["modules/compute-emr-serverless/main.tf"]
"modules/compute-emr-ec2-spot" = ["modules/compute-emr-ec2-spot/main.tf"]
"modules/compute-databricks-delta" = ["modules/compute-databricks-delta/main.tf"]
"modules/speed-layer-kinesis" = ["modules/speed-layer-kinesis/main.tf"]
"modules/ingest-firehose" = ["modules/ingest-firehose/main.tf"]
"modules/ingestion-appflow" = ["modules/ingestion-appflow/main.tf"]
"modules/ingestion-dms" = ["modules/ingestion-dms/main.tf"]
"modules/ingestion-sftp" = ["modules/ingestion-sftp/main.tf"]
"modules/ingestion-webhook" = ["modules/ingestion-webhook/main.tf"]
"modules/metadata-control-table" = ["modules/metadata-control-table/main.tf"]
"modules/metadata-control-table/scripts" = ["modules/metadata-control-table/scripts/fetch_pipeline_config.py"]
"modules/streaming-msk-kafka" = ["modules/streaming-msk-kafka/main.tf"]
"modules/warehouse-snowflake-aws" = ["modules/warehouse-snowflake-aws/main.tf"]
"modules/dq-great-expectations" = ["modules/dq-great-expectations/main.tf"]
"modules/schema-registry-glue" = ["modules/schema-registry-glue/main.tf"]
"modules/query-athena" = ["modules/query-athena/main.tf"]
"modules/consumption-redshift-serverless" = ["modules/consumption-redshift-serverless/main.tf"]
"modules/table-format-iceberg" = ["modules/table-format-iceberg/main.tf"]
"modules/compaction-glue" = ["modules/compaction-glue/main.tf"]
"modules/compaction-glue/scripts" = ["modules/compaction-glue/scripts/compact.py"]
"modules/governance-observability" = ["modules/governance-observability/main.tf"]
"modules/databricks-workspace" = ["modules/databricks-workspace/main.tf"]
"modules/networking-vpc" = ["modules/networking-vpc/main.tf"]
"modules/governance-lakeformation" = ["modules/governance-lakeformation/main.tf"]
"modules/security-iam-scoped" = ["modules/security-iam-scoped/main.tf"]
# The semantic-layer modules ship scaffolds as well as HCL; the scaffold IS the
# deliverable, so a wheel with only main.tf would install an empty promise.
"modules/dbt-semantic-layer" = ["modules/dbt-semantic-layer/main.tf", "modules/dbt-semantic-layer/dbt_project.yml"]
"modules/dbt-semantic-layer/models" = ["modules/dbt-semantic-layer/models/semantic_models.yml", "modules/dbt-semantic-layer/models/metrics.yml"]
"modules/cube-semantic-layer" = ["modules/cube-semantic-layer/main.tf"]
"modules/cube-semantic-layer/cube" = ["modules/cube-semantic-layer/cube/cube.js"]
"modules/cube-semantic-layer/cube/schema" = ["modules/cube-semantic-layer/cube/schema/CustomerEvents.js"]
"docs" = [
    "docs/architecture_synthesis.md",
    "docs/architecture_svg_skeleton.svg",
    "docs/architecture_svg_spec.md",
    "docs/documentation_ledger.md",
    "docs/enterprise_iam_manifest.md",
