# IRSA: the pod assumes an IAM role directly, with no static AWS keys anywhere.
#
# Without this annotation the pod silently falls back to the EKS *node* role, which is shared
# by every workload on that node. That is not a failure you notice -- AWS calls keep working,
# with the wrong identity and far more permission than intended, and the audit trail names
# the node instead of the control plane.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minusops-control-plane
  namespace: minusops
  labels:
    app.kubernetes.io/name: minusops
    app.kubernetes.io/component: control-plane
  annotations:
    # Replace <account-id>. The trust policy on this role must name the cluster's OIDC
    # provider and this exact namespace/serviceaccount pair, or any pod in the cluster
    # could assume it.
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/MinusOpsControlPlaneRole
    eks.amazonaws.com/sts-regional-endpoints: "true"
