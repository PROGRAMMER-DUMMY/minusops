# Internal ALB. `scheme: internal` is the single most consequential line in this directory --
# flipping it to internet-facing publishes live AWS cost and account data to the internet,
# and nothing else in the stack would object.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minusops-control-plane
  namespace: minusops
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    # Corporate TLS terminates at the ALB. Replace with your ACM certificate ARN.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account-id>:certificate/<cert-id>
    alb.ingress.kubernetes.io/healthcheck-path: /
    # Redirect any plaintext listener rather than serving the console over HTTP.
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - host: minusops.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minusops-control-plane
                port:
                  number: 8050
